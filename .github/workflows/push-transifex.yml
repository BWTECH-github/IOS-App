# Modified by BW-Tech GmbH: pushing source strings to the upstream Transifex
# project is disabled for BW-Tech forks. The workflow stays available for
# manual runs.
name: "Push source language to Transifex"

on:
  workflow_dispatch:

jobs:
  push-translations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (previously v4)

      - name: l10n-push-source
        uses: transifex/cli-action@584fd205cbe598773b5a81ce711fa44842678189 # v2
        with:
          token: ${{ secrets.TX_TOKEN }}
          args: push -s
