# Modified by BW-Tech GmbH: the default branch of this fork is `main`, not
# `master`, so the build never ran. Manual runs are possible as well.
name: Build Xcode project

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build Xcode project
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          submodules: true
      - name: mxcl/Xcodebuild
        uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
        with:
          scheme: ownCloud
          action: build
          platform: iOS
          platform-version: 26.2
          xcode: 26.2
