name: Calens Changelog
# This workflow is triggered on pushes to the repository.
on:
  push:
    branches:
    - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Calens Changelog
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "main"
          persist-credentials: false

      - uses: actionhippie/calens@244f3e5c328b842a740113859b87bbebf697f63b # v1.13.1
        with:
          target: CHANGELOG.md

      # Upstream used a GitHub App token (TRANSLATION_APP_* secrets) that does
      # not exist in this fork - the built-in GITHUB_TOKEN can open PRs here.
      - name: Create or update changelog PR
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/changelog-update
          base: main
          commit-message: "chore: update changelog"
          title: "chore: update changelog"
          body: "Automated changelog update via Calens. This pull request is updated on each push to `main` — merging it will close it and a fresh one will be opened on the next change."
          delete-branch: true
          sign-commits: true
